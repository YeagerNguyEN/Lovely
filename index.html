<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Love Question</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
      * {
        box-sizing: border-box;
        -webkit-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent; /* Tắt viền xanh khi chạm trên Android */
      }

      body {
        margin: 0;
        padding: 0;
        font-family: "Quicksand", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #ffd6e0, #ffe6f0);
        overflow: hidden;
      }

      .container {
        text-align: center;
        position: relative;
        width: 90%;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      #gif {
        width: 100%;
        max-width: 220px;
        border-radius: 20px;
        margin-bottom: 20px;
        box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
      }

      h1 {
        color: #d63384;
        margin-bottom: 30px;
        font-size: clamp(1.5rem, 5vw, 2rem);
        line-height: 1.4;
      }

      .buttons {
        display: flex;
        justify-content: center;
        gap: 30px; /* Khoảng cách giữa 2 nút */
        width: 100%;
        height: 50px;
        position: relative;
      }

      /* Khung bao bọc giữ vị trí cho các nút không bị dịch chuyển */
      .btn-wrapper {
        width: 120px;
        height: 50px;
        position: relative;
      }

      button {
        width: 100%;
        height: 100%;
        font-size: 18px;
        font-weight: 700;
        font-family: "Quicksand", sans-serif;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      }

      #yes {
        background: #ff4d6d;
        color: white;
      }

      #yes:hover, #yes:active {
        transform: scale(1.1);
        box-shadow: 0 6px 15px rgba(255, 77, 109, 0.4);
      }

      #no {
        background: #6c757d;
        color: white;
        position: absolute; /* Tuyệt đối so với .btn-wrapper lúc đầu */
        top: 0;
        left: 0;
      }

      .break-heart {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(1);
        font-size: clamp(80px, 20vw, 120px);
        color: #ff4d6d;
        animation: pulse 1s infinite;
      }

      @keyframes pulse {
        0% { transform: translate(-50%, -50%) scale(1); }
        50% { transform: translate(-50%, -50%) scale(1.2); }
        100% { transform: translate(-50%, -50%) scale(1); }
      }
    </style>
  </head>
  <body>
    <div class="container" id="container">
      <img
        id="gif"
        src="https://i.pinimg.com/originals/3c/e8/84/3ce884bb29ad1909a2c253354497420f.gif"
        alt="cute cat gif"
      />
      <h1 id="question">Do you want to be my Girlfriend? 💕</h1>
      <div class="buttons" id="buttons">
        <div class="btn-wrapper">
          <button id="yes">Yes</button>
        </div>
        <div class="btn-wrapper">
          <button id="no">No</button>
        </div>
      </div>
    </div>

    <script>
      const yesBtn = document.getElementById("yes");
      const noBtn = document.getElementById("no");
      const gif = document.getElementById("gif");
      const question = document.getElementById("question");
      const buttons = document.getElementById("buttons");
      const container = document.getElementById("container");

      let noMoved = false;
      let lastX = null, lastY = null;

      // ------------------- Xử lý Nút NO -------------------
      document.addEventListener("mousemove", (e) => {
        if (isMobile()) return;
        const rect = noBtn.getBoundingClientRect();
        const buffer = 50;

        if (
          e.clientX > rect.left - buffer &&
          e.clientX < rect.right + buffer &&
          e.clientY > rect.top - buffer &&
          e.clientY < rect.bottom + buffer
        ) {
          moveNoButton();
        }
      });

      noBtn.addEventListener("touchstart", (e) => {
        e.preventDefault(); 
        moveNoButton();
      });

      function moveNoButton() {
        if (!noMoved) {
          noMoved = true;
          
          // Lấy vị trí thực tế của nút No ngay trước khi dịch chuyển
          const rect = noBtn.getBoundingClientRect();
          
          // Khóa cứng tọa độ cũ của nút No dưới dạng Fixed để không bị giật phát đầu
          noBtn.style.left = `${rect.left}px`;
          noBtn.style.top = `${rect.top}px`;
          noBtn.style.width = `${rect.width}px`;
          noBtn.style.height = `${rect.height}px`;
          noBtn.style.position = "fixed";
          noBtn.style.zIndex = "999";
          
          // Ép trình duyệt cập nhật lại giao diện trước khi áp dụng tọa độ mới
          noBtn.offsetHeight; 
        }

        const padding = 20;
        const maxX = window.innerWidth - noBtn.offsetWidth - padding;
        const maxY = window.innerHeight - noBtn.offsetHeight - padding;

        let x, y;

        do {
          x = Math.max(padding, Math.random() * maxX);
          y = Math.max(padding, Math.random() * maxY);
        } while (
          lastX !== null &&
          lastY !== null &&
          Math.abs(x - lastX) < 80 && 
          Math.abs(y - lastY) < 80
        );

        lastX = x;
        lastY = y;

        // Sử dụng hiệu ứng Trượt (Transition) với gia tốc mượt mà (cubic-bezier) giúp chuyển động sinh động hơn
        noBtn.style.transition = "left 0.35s cubic-bezier(0.25, 1, 0.5, 1), top 0.35s cubic-bezier(0.25, 1, 0.5, 1)";
        noBtn.style.left = `${x}px`;
        noBtn.style.top = `${y}px`;
      }

      // ------------------- Xử lý Nút YES -------------------
      yesBtn.addEventListener("click", () => {
        gif.remove();
        question.remove();
        buttons.remove();

        const heart = document.createElement("div");
        heart.classList.add("break-heart");
        heart.textContent = "💖";
        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();

          const newGif = document.createElement("img");
          newGif.id = "gif";
          newGif.src = "https://i.pinimg.com/originals/92/c4/2f/92c42fb1c24200e23ac70dfa011e30b1.gif";
          newGif.style.width = "100%";
          newGif.style.maxWidth = "220px";
          newGif.style.borderRadius = "20px";
          newGif.style.marginBottom = "20px";
          newGif.style.boxShadow = "0 8px 15px rgba(0, 0, 0, 0.1)";
          container.appendChild(newGif);

          const finalText = document.createElement("h1");
          finalText.id = "question";
          finalText.textContent = noMoved ? "I knew it 💖" : "Luv youuu 💖💖";
          finalText.style.color = "#d63384";
          finalText.style.fontSize = "clamp(1.8rem, 6vw, 2.5rem)";
          container.appendChild(finalText);
        }, 2000);
      });

      function isMobile() {
        return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      }
    </script>
  </body>
</html>
